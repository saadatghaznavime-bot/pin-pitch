name: PIN&PITCH tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app
          node --check static/talk-to-agent.js
          python -c "import re, pathlib; s=pathlib.Path('static/index.html').read_text(); blocks=re.findall(r'<script>(.*?)</script>', s, re.S); pathlib.Path('/tmp/pinpitch-inline.js').write_text(blocks[0])"
          node --check /tmp/pinpitch-inline.js
      - name: Run tests
        env:
          JWT_SECRET: pinpitch-ci-only-secret
          DATABASE_URL: sqlite://
        run: python -m pytest -q
